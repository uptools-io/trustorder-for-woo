name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  # Runs on every push to main (and on manual runs). CI and the release
  # below only run when the plugin header carries a version that has no
  # GitHub release yet, so a follow-up fix can still complete a release.
  precheck:
    runs-on: ubuntu-latest
    outputs:
      release_needed: ${{ steps.check.outputs.release_needed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Is this version already released?
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -m1 "Version:" trustorder-for-woo.php | sed 's/.*Version:[[:space:]]*//' | tr -d '[:space:]')
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release_needed=false" >> "$GITHUB_OUTPUT"
            echo "v$VERSION is already released - nothing to do"
          else
            echo "release_needed=true" >> "$GITHUB_OUTPUT"
            echo "v$VERSION has no release yet - running CI and the release"
          fi

  # The same checks as CI. A release, and the tag it creates, only happen
  # when all of them pass.
  ci:
    needs: precheck
    if: needs.precheck.outputs.release_needed == 'true'
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Extract version from plugin file
        id: get_version
        run: |
          VERSION=$(grep -m1 "Version:" trustorder-for-woo.php | sed 's/.*Version:[[:space:]]*//' | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Extracted version: $VERSION"

      - name: Check if release exists
        id: check_release
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v$VERSION already exists - skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Release v$VERSION does not exist - will create"
          fi

      # The ZIP is built from `git archive HEAD`: the committed build/ (CI
      # checks it matches src/) and vendor-prefixed/ are in, everything marked
      # export-ignore in .gitattributes is out, and the script fails if a
      # development file slipped in.
      - name: Create release ZIP
        if: steps.check_release.outputs.exists == 'false'
        run: bin/build-zip.sh dist

      - name: Create tag and release
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: v${{ steps.get_version.outputs.version }}
          body: |
            ## TrustOrder for WooCommerce v${{ steps.get_version.outputs.version }}

            See [readme.txt](https://github.com/uptools-io/trustorder-for-woo/blob/main/readme.txt) for changelog.
          files: |
            dist/trustorder-for-woo-${{ steps.get_version.outputs.version }}.zip
          draft: false
          prerelease: false
          generate_release_notes: true
